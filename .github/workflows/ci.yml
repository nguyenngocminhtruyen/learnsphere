name: Phase 0 verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: pnpm/action-setup@v4
        with: {version: '10.20.0'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -e 'apps/ai-service[dev]' -e 'apps/ai-worker[dev]'
      - run: pnpm --dir contracts install --frozen-lockfile
      - run: pnpm --dir infra/cdk install --frozen-lockfile
      - run: make verify
      - name: Select Java 25 launcher for JVM selection regression
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - name: Build API with pinned Java 21 daemon from Java 25 launcher
        working-directory: apps/api
        run: ./gradlew --no-daemon clean test bootJar
      - run: python scripts/check_ci_gates.py
      - run: pnpm --dir apps/web audit --prod --audit-level=high
      - name: OpenAPI backward compatibility
        if: github.event_name == 'pull_request'
        run: python scripts/check_contracts.py "${{ github.event.pull_request.base.sha }}"
      - run: docker compose up -d --build
      - run: make smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down -v
